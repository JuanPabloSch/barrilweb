<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración - Barril Verde</title>

    <meta name="description" content="Administración de productos Barril Verde">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>
    

    <div id="navbar-container"></div>

    <section class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            Administración de Productos
                        </h1>

                        <form id="productoForm">

                            <div class="mb-3">
                                <label for="foto" class="form-label">
                                    Foto
                                </label>

                                <input
                                    type="file"
                                    id="foto"
                                    class="form-control"
                                    accept="image/*"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control"
                                    maxlength="100"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="categoria" class="form-label">
                                    Categoría
                                </label>

                                <input
                                    type="text"
                                    id="categoria"
                                    class="form-control"
                                    maxlength="50"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">
                                    Descripción
                                </label>

                                <textarea
                                    id="descripcion"
                                    class="form-control"
                                    rows="4"
                                    maxlength="300"
                                    required></textarea>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Guardar Producto

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

        <div class="text-end mb-3">
    <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm fw-bold">
        🔒 Cerrar Sesión
    </button>
</div>

        <hr class="my-5">

        <h2 class="text-center mb-4">
            Productos Cargados
        </h2>

        <div id="listaProductos" class="row g-4">
            </div>

    </section>
    

    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarModalLabel">Editar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editarForm">
                        <input type="hidden" id="editId">
                        <input type="hidden" id="editFotoUrlActual">
                        
                        <div class="mb-3">
                            <label for="editNombre" class="form-label">Nombre</label>
                            <input type="text" id="editNombre" class="form-control" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="editCategoria" class="form-label">Categoría</label>
                            <input type="text" id="editCategoria" class="form-control" maxlength="50" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDescripcion" class="form-label">Descripción</label>
                            <textarea id="editDescripcion" class="form-control" rows="4" maxlength="300" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editFoto" class="form-label">Nueva Foto (Opcional)</label>
                            <input type="file" id="editFoto" class="form-control" accept="image/*">
                            <small class="text-muted">Dejalo vacío para mantener la foto que ya tiene.</small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmarBorrarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-3 border-0 shadow">
                <div class="modal-body">
                    <div class="text-danger mb-3">
                        <span class="fs-1">⚠️</span>
                    </div>
                    <h5 class="modal-title mb-2 fw-bold">¿Borrar producto?</h5>
                    <p class="text-muted small">Esta acción eliminará el artículo de forma definitiva de la base de datos.</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <button type="button" class="btn btn-light btn-sm px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" id="btnConfirmarBorrar" class="btn btn-danger btn-sm px-4">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="notificacionToast" class="toast align-items-center text-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="notificacionMensaje"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        fetch("components/navbar.html")
            .then(response => response.text())
            .then(data => { document.getElementById("navbar-container").innerHTML = data; });

        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => { document.getElementById("footer-container").innerHTML = data; });
    </script>

    <script src="js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
