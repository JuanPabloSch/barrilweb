<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novedades - Barril Verde</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="description" content="Novedades, promociones y nuevos ingresos de Barril Verde.">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-30HXJ0G29T"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-30HXJ0G29T');
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>

    <div id="navbar-container"></div>

    <section class="hero-novedades">
        <div class="overlay"></div>
        <div class="contenido">
            <h1 class="display-4 fw-bold">Novedades</h1>
            <p class="lead">Descubrí los últimos ingresos, promociones y productos destacados.</p>
        </div>
    </section>

    <section class="container my-5">
        <div id="cargando" class="text-center my-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Cargando novedades...</span>
            </div>
            <p class="text-muted mt-2">Buscando los últimos ingresos...</p>
        </div>

        <div id="listaNovedades" class="row g-4"></div>
    </section>

    <div id="footer-container"></div>

    <script>
        fetch("components/navbar.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar-container").innerHTML = data;
            });

        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            });
    </script>

    <script src="js/novedades.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
